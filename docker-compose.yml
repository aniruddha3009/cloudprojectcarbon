# Local deployment: docker compose up --build   →  http://localhost:8080
services:
  backend:
    build: ./backend
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: sqlite:////app/data/carbon_debt.db
      CORS_ORIGINS: http://localhost:8080
    volumes:
      - carbon_data:/app/data
    restart: unless-stopped

  frontend:
    build: ./frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8080:80"
    restart: unless-stopped

volumes:
  carbon_data:
