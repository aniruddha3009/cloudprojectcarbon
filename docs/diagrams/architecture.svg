<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker>
    <style>
      .box{fill:#fff;stroke:#3b3b3b;stroke-width:1.4;rx:10}
      .core{fill:#f2efff;stroke:#6c5ce7}
      .ext{fill:#eef8f2;stroke:#1a9e5c;stroke-dasharray:5 4}
      .db{fill:#f5f5f5}
      .t{font-size:16px;font-weight:600;fill:#1b1b1b}
      .s{font-size:12.5px;fill:#444}
      .h{font-size:13px;font-weight:600;fill:#6b6b6b}
      .l{stroke:#555;stroke-width:1.5;fill:none;marker-end:url(#a)}
      .lab{font-size:11.5px;fill:#555}
    </style>
  </defs>
  <rect width="1200" height="720" fill="#ffffff"/>
  <text x="30" y="38" font-size="22" font-weight="700" fill="#1b1b1b">Carbon Debt Computing — system architecture</text>
  <text x="30" y="60" class="s">Local simulated cloud scheduler (default) · same engine drives live controller and experiments</text>

  <!-- Browser -->
  <text x="30" y="100" class="h">Presentation</text>
  <rect class="box" x="30" y="110" width="250" height="250"/>
  <text x="48" y="138" class="t">React dashboard</text>
  <text x="48" y="160" class="s">TypeScript · Vite · Tailwind · Recharts</text>
  <text x="48" y="190" class="s">• Overview (debt equation, charts)</text>
  <text x="48" y="210" class="s">• Workloads (jobs, receipts)</text>
  <text x="48" y="230" class="s">• Carbon controller (plan, bands)</text>
  <text x="48" y="250" class="s">• Debt ledger (verify, tamper demo)</text>
  <text x="48" y="270" class="s">• Experiments (policy comparison)</text>
  <text x="48" y="290" class="s">• Telemetry &amp; settings</text>
  <text x="48" y="325" class="s">Polls /api every 1–4 s; renders</text>
  <text x="48" y="343" class="s">only backend-returned values</text>

  <!-- API -->
  <text x="330" y="100" class="h">API (FastAPI)</text>
  <rect class="box" x="330" y="110" width="230" height="250"/>
  <text x="348" y="138" class="t">REST /api + OpenAPI</text>
  <text x="348" y="165" class="s">Pydantic validation</text>
  <text x="348" y="185" class="s">X-Admin-Token on mutations</text>
  <text x="348" y="205" class="s">CORS allow-list</text>
  <text x="348" y="225" class="s">JSON structured logs</text>
  <text x="348" y="245" class="s">/api/health</text>
  <text x="348" y="280" class="s">jobs · scenario · sim · controller</text>
  <text x="348" y="300" class="s">ledger · verify · experiments</text>
  <text x="348" y="320" class="s">telemetry · exports (CSV/JSON)</text>

  <!-- Services -->
  <text x="610" y="100" class="h">Services</text>
  <rect class="box" x="610" y="110" width="260" height="78"/>
  <text x="628" y="136" class="t">SimulationService</text>
  <text x="628" y="157" class="s">DB ⇄ engine per tick · process lock</text>
  <text x="628" y="175" class="s">autoplay thread · scenario runner</text>
  <rect class="box" x="610" y="196" width="260" height="62"/>
  <text x="628" y="222" class="t">ExperimentService</text>
  <text x="628" y="243" class="s">background replay · progress · export</text>
  <rect class="box" x="610" y="266" width="260" height="94"/>
  <text x="628" y="292" class="t">Telemetry adapters</text>
  <text x="628" y="313" class="s">processes, CPU/memory, RAPL energy</text>
  <text x="628" y="331" class="s">grid: India Energy Atlas (Live mode)</text>
  <text x="628" y="349" class="s">every value carries a source label</text>

  <!-- External -->
  <text x="920" y="100" class="h">External (optional)</text>
  <rect class="box ext" x="920" y="110" width="250" height="70"/>
  <text x="938" y="138" class="t">Grid carbon APIs</text>
  <text x="938" y="160" class="s">India Energy Atlas (X-API-Key)</text>
  <rect class="box ext" x="920" y="190" width="250" height="70"/>
  <text x="938" y="218" class="t">Windows processes</text>
  <text x="938" y="240" class="s">psutil, read-only</text>
  <rect class="box ext" x="920" y="270" width="250" height="90"/>
  <text x="938" y="298" class="t">Host power sensors</text>
  <text x="938" y="320" class="s">Windows Energy Meter (RAPL)</text>
  <text x="938" y="340" class="s">Linux /sys/class/powercap (RAPL)</text>

  <!-- Core -->
  <text x="30" y="410" class="h">Deterministic core (pure Python, Decimal accounting, no I/O)</text>
  <rect class="box core" x="30" y="420" width="1140" height="170"/>
  <rect class="box" x="50" y="440" width="200" height="130"/>
  <text x="66" y="466" class="t">Engine</text>
  <text x="66" y="488" class="s">15-min slots</text>
  <text x="66" y="506" class="s">job state machine</text>
  <text x="66" y="524" class="s">capacity + reserve</text>
  <text x="66" y="542" class="s">energy · emissions · debt</text>
  <rect class="box" x="270" y="440" width="210" height="130"/>
  <text x="286" y="466" class="t">Policies</text>
  <text x="286" y="488" class="s">FIFO · Threshold</text>
  <text x="286" y="506" class="s">Debt controller (reactive)</text>
  <text x="286" y="524" class="s">Predictive controller</text>
  <text x="286" y="542" class="s">priority inversion · throttle</text>
  <rect class="box" x="500" y="440" width="210" height="130"/>
  <text x="516" y="466" class="t">Predictive planner</text>
  <text x="516" y="488" class="s">EDF capacity reservation</text>
  <text x="516" y="506" class="s">green-only windows if debt</text>
  <text x="516" y="524" class="s">feasibility repair pass</text>
  <text x="516" y="542" class="s">debt projection</text>
  <rect class="box" x="730" y="440" width="200" height="130"/>
  <text x="746" y="466" class="t">Accounting</text>
  <text x="746" y="488" class="s">debt above I_threshold</text>
  <text x="746" y="506" class="s">verified credits</text>
  <text x="746" y="524" class="s">no banking of surplus</text>
  <text x="746" y="542" class="s">carbon receipts</text>
  <rect class="box" x="950" y="440" width="200" height="130"/>
  <text x="966" y="466" class="t">Hash-chained ledger</text>
  <text x="966" y="488" class="s">SHA-256(canonical ‖ prev)</text>
  <text x="966" y="506" class="s">idempotency keys</text>
  <text x="966" y="524" class="s">verify / tamper demo</text>
  <text x="966" y="542" class="s">balance ≥ 0 invariant</text>

  <!-- DB -->
  <rect class="box db" x="330" y="625" width="540" height="70"/>
  <text x="348" y="652" class="t">SQLite (local, default) · PostgreSQL (cloud option)</text>
  <text x="348" y="674" class="s">jobs · decisions · executions · ledger · readings · timeline · experiments</text>

  <!-- arrows -->
  <path class="l" d="M280 235 H328"/><text x="286" y="226" class="lab">HTTP</text>
  <path class="l" d="M560 235 H608"/>
  <path class="l" d="M920 145 H872"/>
  <path class="l" d="M920 225 H872"/>
  <path class="l" d="M920 315 H872"/>
  <path class="l" d="M740 360 V418"/><text x="748" y="395" class="lab">rebuild engine, step, persist</text>
  <path class="l" d="M600 590 V623"/>
  <path class="l" d="M640 623 V592" />
</svg>

