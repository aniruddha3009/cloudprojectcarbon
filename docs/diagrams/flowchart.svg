<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker>
    <style>
      .b{fill:#fff;stroke:#3b3b3b;stroke-width:1.4}
      .d{fill:#fff8e8;stroke:#c98500;stroke-width:1.4}
      .g{fill:#eef8f2;stroke:#1a9e5c;stroke-width:1.4}
      .v{fill:#f2efff;stroke:#6c5ce7;stroke-width:1.4}
      .t{font-size:14px;fill:#1b1b1b;text-anchor:middle}
      .ts{font-size:12px;fill:#444;text-anchor:middle}
      .l{stroke:#555;stroke-width:1.5;fill:none;marker-end:url(#a)}
      .y{font-size:12px;fill:#1a7f4b;font-weight:600}
      .n{font-size:12px;fill:#b0413e;font-weight:600}
    </style>
  </defs>
  <rect width="1200" height="760" fill="#fff"/>
  <text x="30" y="38" font-size="22" font-weight="700" fill="#1b1b1b">One scheduling slot (15 simulated minutes) — predictive debt controller</text>

  <rect class="b" x="60" y="70" width="240" height="50" rx="10"/><text x="180" y="100" class="t">Arrivals → queued</text>
  <path class="l" d="M180 120 V150"/>
  <rect class="b" x="60" y="150" width="240" height="56" rx="10"/><text x="180" y="174" class="t">Emergency jobs start at 100%</text><text x="180" y="193" class="ts">regardless of intensity (reserve worker)</text>
  <path class="l" d="M180 206 V236"/>
  <rect class="v" x="60" y="236" width="240" height="56" rx="10"/><text x="180" y="260" class="t">Effective debt D = booked + accruing</text><text x="180" y="279" class="ts">→ debt band (5 levels)</text>
  <path class="l" d="M180 292 V322"/>
  <rect class="v" x="60" y="322" width="240" height="70" rx="10"/><text x="180" y="346" class="t">Planner (forecast horizon)</text><text x="180" y="365" class="ts">EDF capacity reservation, per job pick</text><text x="180" y="382" class="ts">feasible window s + runtime ≤ deadline</text>
  <path class="l" d="M180 392 V422"/>
  <polygon class="d" points="180,422 300,472 180,522 60,472"/><text x="180" y="468" class="t">D &gt; 0 ?</text><text x="180" y="486" class="ts">(priority inversion)</text>
  <path class="l" d="M300 472 H380"/><text x="318" y="462" class="y">yes</text>
  <rect class="g" x="380" y="440" width="260" height="64" rx="10"/><text x="510" y="466" class="t">Only fully green windows (≤ G)</text><text x="510" y="485" class="ts">if none feasible → least-carbon window</text>
  <path class="l" d="M180 522 V552"/><text x="190" y="542" class="n">no</text>
  <rect class="b" x="60" y="552" width="240" height="64" rx="10"/><text x="180" y="578" class="t">Lowest-carbon feasible window</text><text x="180" y="597" class="ts">delay only if saving ≥ minimum</text>
  <path class="l" d="M300 584 H700 V520"/>
  <path class="l" d="M640 472 H700"/>
  <polygon class="d" points="760,420 880,472 760,524 640,472" transform="translate(60,0)"/><text x="820" y="468" class="t">start now?</text>
  <path class="l" d="M940 472 H990"/><text x="950" y="462" class="y">yes</text>
  <rect class="b" x="990" y="440" width="180" height="64" rx="10"/><text x="1080" y="466" class="t">START / REPAYMENT</text><text x="1080" y="485" class="ts">_START (logged reason)</text>
  <path class="l" d="M820 524 V560"/><text x="830" y="546" class="n">no</text>
  <rect class="v" x="700" y="560" width="240" height="64" rx="10"/><text x="820" y="584" class="t">DEFER until planned slot</text><text x="820" y="603" class="ts">first deferral records a baseline</text>

  <rect class="b" x="400" y="70" width="300" height="70" rx="10"/><text x="550" y="96" class="t">Throttle running flexible jobs</text><text x="550" y="115" class="ts">band table (100/50/20%/pause), never emergencies,</text><text x="550" y="131" class="ts">only if finish ≤ deadline − 2 slots; full speed if green</text>
  <path class="l" d="M300 264 H350 V105 H398"/>

  <rect class="b" x="760" y="70" width="400" height="70" rx="10"/><text x="960" y="96" class="t">Execute slot for every running job</text><text x="960" y="115" class="ts">E = P·(s+(1−s)c)·t ;  emissions = E·I ;  debt = E·max(0, I − I_thr)</text><text x="960" y="131" class="ts">real CPU proxy kernel runs; values persisted per slot</text>
  <path class="l" d="M700 105 H758"/>
  <path class="l" d="M960 140 V170"/>
  <polygon class="d" points="960,170 1080,215 960,260 840,215"/><text x="960" y="220" class="t">job finished?</text>
  <path class="l" d="M960 260 V290"/><text x="970" y="280" class="y">yes</text>
  <rect class="v" x="790" y="290" width="340" height="96" rx="10"/><text x="960" y="314" class="t">Settle in hash-chained ledger</text><text x="960" y="333" class="ts">DEBT_INCURRED if debt &gt; 0</text><text x="960" y="350" class="ts">credit = E_full·I_baseline − actual emissions if all checks pass</text><text x="960" y="367" class="ts">applied = min(credit, balance); surplus not banked</text>
  <path class="l" d="M960 386 V396"/>
  <text x="960" y="410" class="ts">balance hits 0 → DEBT_CLEARED, inversion lifted · snapshot timeline</text>

  <text x="60" y="680" font-size="13" fill="#444">Legend: violet = debt logic · green = green-window repayment · amber = decision · I_thr = 350 g/kWh, G = 200 g/kWh by default (configurable).</text>
  <text x="60" y="702" font-size="13" fill="#444">FIFO, Threshold and the reactive debt controller share the same engine, accounting and deadline checks; only the decision step differs.</text>
</svg>

